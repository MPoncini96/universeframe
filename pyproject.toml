[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universeframe"
version = "0.1.0"
description = "Local, pandas-native adaptive-universe ranking on top of vectorframe"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "yfinance>=0.2",
    "vectorframe @ git+https://github.com/MPoncini96/vectorframe.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["universeframe*"]
